<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CECYTE XICOTEPEC</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e2f4f1;
            text-align: center; 
        }

        .encabezado {
            background-color: #004d40;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
        }

        .nombre {
            font-size: 45px;
            font-weight: bold;
            margin-top: 10px;
            font-family: 'Georgia', serif;
        }

        footer {
            background-color: #004d40;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-family: 'Times New Roman', Times, serif;
        }

        .contenido {
            font-size: 18px;
            color: #333333;
            padding: 20px;
            font-family: 'Lucida Sans', Geneva, sans-serif;
        }

        .logo {
            border-radius: 8px;
            border: 3px solid #ffffff;
        }
    </style>
</head>
<body>

    <div class="encabezado">
        <img src="logo.png" class="logo" width="150">

        <div class="nombre">CECYTE XICOTEPEC</div>
    </div>

    <div class="contenido">
        <p>Bienvenidos al CECYTE Xicotepec, una institución dedicada a la educación de calidad en el 
            área de programación y mantenimiento a motores de combustión.</p>
    </div>

    <footer>
        <p>2025 CECYTE XICOTEPEC - Alejandro</p>
    </footer>

</body>
</html>
